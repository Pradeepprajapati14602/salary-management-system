services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary_mgmt
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
